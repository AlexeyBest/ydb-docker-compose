global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ydb_ydb
    metrics_path: /counters/counters=ydb/name_label=name/prometheus
    static_configs:
      - targets: ["ydb:8765"]
        labels: { container: ydb, host: ydb-local }

  - job_name: ydb_utils
    metrics_path: /counters/counters=utils/prometheus
    static_configs:
      - targets: ["ydb:8765"]
        labels: { container: ydb, host: ydb-local }

