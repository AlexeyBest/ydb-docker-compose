global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ydb_ydb
    metrics_path: /counters/counters=ydb/name_label=name/prometheus
    metric_relabel_configs:
      - source_labels: ["__name__"]
        target_label: "__name__"
        replacement: "ydb_$1"
    relabel_configs:
      - regex: ([^:]+)(:[0-9]+)?
        replacement: ${1}
        source_labels:
        - __address__
        target_label: instance
      - source_labels:
        - __address__
        target_label: counter
        replacement: ydb
    static_configs:
      - targets: ["ydb:8765"]
        labels: { container: ydb-dynamic, host: ydb-local }

